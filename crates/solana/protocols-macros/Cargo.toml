[package]
name = "solana-protocols-macros"
description = "Derive macros for solana-protocols crate"
version.workspace = true
edition.workspace = true
authors = ["0xpluto <75406541+0xpluto@users.noreply.github.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/0xpluto/solana-protocols"
keywords = ["solana", "anchor", "macros", "discriminator"]
categories = ["cryptography::cryptocurrencies", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
# Proc macro essentials
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
# Reading vendored IDLs at macro-expansion time to verify account layouts.
serde_json = "1"

# For parsing attributes
darling = "0.21"

# Compile-time discriminator derivation (build-time only — never in the
# release binary; the macro computes the bytes at expansion and emits a literal).
sha2 = "0.10"

# PascalCase handler ident → SHOUTY_SNAKE_CASE const name in OnchainAccount.
heck = "0.5"

[dev-dependencies]
# For testing the macros
solana-program = "2.2"
solana-sdk = "2.2"

[lints]
workspace = true
