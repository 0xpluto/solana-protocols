[package]
name = "solana-account-cache"
version.workspace = true
edition.workspace = true
authors = ["0xpluto <75406541+0xpluto@users.noreply.github.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/0xpluto/solana-protocols"
keywords = ["solana", "cache", "accounts", "geyser"]
categories = ["cryptography::cryptocurrencies", "caching"]
description = "LocalCache — slot-versioned in-memory mirror of on-chain account state"


[dependencies]
solana-account-traits = { version = "0.1.1", path = "../traits" }
solana-protocols = { version = "0.1.1", path = "../../solana/protocols", features = ["cache-handlers"] }
dashmap = { workspace = true, features = ["serde"] }
serde = { workspace = true }
bincode = "1.3"
flate2 = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
solana-pubkey = { workspace = true, features = ["serde"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[lints]
workspace = true
