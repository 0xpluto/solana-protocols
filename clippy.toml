# Clippy configuration — the machine-checkable half of docs/code-doctrine.md.
#
# A rule that fails the build is one nobody has to remember. Everything here
# maps to a numbered doctrine section; if you are about to add an entry, add the
# section reference too, so a future reader can find the argument rather than
# just the verdict.

# --- §1.3 one function, one decision -----------------------------------------
# A function that decides AND executes cannot be tested at the seam. The
# default is 100; we start at 120 so the gate lands on genuinely overloaded
# functions rather than on every long match, and ratchets down over time.
too-many-lines-threshold = 120

# Branch-count proxy for the same rule. Default is 25.
cognitive-complexity-threshold = 25

# §5.3 never accept two arguments that must agree — a long parameter list is
# usually several of them. Default is 7.
too-many-arguments-threshold = 7

# A bool parameter is a hidden mode switch; two is a truth table the caller has
# to remember. §5 intern rule.
max-fn-params-bools = 1

# --- §3.5 / §8.1 things that must never be called ----------------------------
# All entries share one severity (the `clippy::disallowed_methods` level), so
# only put things here that are banned outright, never things we merely dislike.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "has NO timeout — a hung socket blocks the caller forever (§3.5). Use ClientBuilder with an explicit .timeout(), and reuse one client." },
]
# Deliberately NOT banning `ClientBuilder::build`: clippy cannot see whether
# `.timeout()` was set, so the rule would fire on correct code. A lint that
# flags the fix as loudly as the bug is how linting gets switched off.

# Doc-comment quality gate for §7.5 — names that look like code but are not
# backticked read as prose and rot silently.
doc-valid-idents = [
    "USDC", "USDT", "USD₮0", "EIP", "ERC", "LayerZero", "RISEx", "dYdX",
    "Hyperliquid", "Solana", "OFT", "IOC", "BBO", "APR", "P&L", "..",
]
